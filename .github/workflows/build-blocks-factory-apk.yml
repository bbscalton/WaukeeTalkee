name: Build Blocks Factory Dispatcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/dispatcher/**"
      - ".github/workflows/build-blocks-factory-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Blocks Factory URL
        run: |
          sed -i 's#https://bbscalton.github.io/WaukeeTalkee/app/#https://talk.neuereatec.org/app/?org=blocks-factory#g' android/dispatcher/build.gradle.kts
          echo "Updated URL in build.gradle.kts:"
          grep DISPATCH_URL android/dispatcher/build.gradle.kts

      - name: Build APK
        working-directory: android
        run: ./gradlew :dispatcher:assembleRelease --no-daemon

      - name: Copy APK to downloads
        run: |
          mkdir -p website/downloads
          cp android/dispatcher/build/outputs/apk/release/dispatcher-release-unsigned.apk website/downloads/BlocksFactory-dispatcher.apk || \
          cp android/dispatcher/build/outputs/apk/release/dispatcher-release.apk website/downloads/BlocksFactory-dispatcher.apk
          ls -la website/downloads/

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/downloads/BlocksFactory-dispatcher.apk
          git diff --staged --quiet || git commit -m "Build Blocks Factory dispatcher APK"
          git push
